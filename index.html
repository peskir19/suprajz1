<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suprajz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">

        <img src="Slike/rat.jpg" class="sticker sticker1" alt="cute rat">
        <img src="Slike/slika1.jpg" class="sticker sticker2" alt="pitbull koncert1">
        <img src="Slike/slika2.jpg" class="sticker sticker3" alt="zoloski1">
        <img src="Slike/slika3.jpg" class="sticker sticker4" alt="zoloski2">
        <img src="Slike/slika4.jpg" class="sticker sticker5" alt="pitbull koncert2">
        <img src="Slike/kornjaca.avif" class="sticker sticker6" alt="kornjaca">
        <img src="Slike/cvijet.png" class="sticker sticker7" alt="cvijet">
        <img src="Slike/sir.jpg" class="sticker sticker8" alt="sir">
        <img src="Slike/maca.jpg" class="sticker sticker9" alt="maca">
        <img src="Slike/srce.png" class="sticker sticker10" alt="srce">
        <img src="Slike/cuko.jpg" class="sticker sticker11" alt="cuko">
        <img src="Slike/mojmarket.jpg" class="sticker sticker12" alt="market">
        <img src="Slike/ikea.png" class="sticker sticker13" alt="ikea">
        <img src="Slike/slika5.jpg" class="sticker sticker15" alt="zoloski3">
        <img src="Slike/slika6.jpeg" class="sticker sticker16" alt="cet">

    <div class="card">
        <h1>Vidimo se za:</h1>

        <div id="countdown">
            <div class="time-box">
                <span id="days">0</span>
                <p>Dana</p>
            </div>

            <div class="time-box">
                <span id="hours">0</span>
                <p>Sati</p>
            </div>

            <div class="time-box">
                <span id="minutes">0</span>
                <p>Minuta</p>
            </div>

            <div class="time-box">
                <span id="seconds">0</span>
                <p>Sekundi</p>
            </div>
        </div>
    </div>
    </div>
<section class="daily-section">

        <h2>Za danas 💌</h2>

        <div class="daily-card">
            <p id="daily-message">
                Today's message will appear here
            </p>
        </div>

</section>
<section class="love-animation">

    <div class="animation-scene">

        <div class="person person-left" id="person-left">
            <div class="head"></div>
            <div class="body-line"></div>
            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>
            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>
        </div>

        <div class="person person-right" id="person-right">
            <div class="head"></div>
            <div class="body-line"></div>
            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>
            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>
        </div>

        <div id="animation-heart">💜</div>

    </div>

</section>
<div class="music-section">
    <button id="music-button">▶ Ova pjesma me podsjeca na tebe ♡</button>

    <p class="music-text">
        For when you miss me a little extra.
    </p>

    <audio id="music" loop>
        <source src="muzika/pjesma.mp3" type="audio/mpeg">
    </audio>
</div>
    <script src="script.js"></script>
</body>
</html>
